<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">

<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:20px}</style></head><body><div id="root"></div>
<script>
loadDS(['../core/Button.jsx','../core/IconButton.jsx','../core/Badge.jsx','../core/Tag.jsx','../core/Card.jsx']).then(({Button,IconButton,Badge,Tag,Card}) => {

      h(Card,{dim:true,stripe:'var(--status-paused-stripe)'},h('b',null,'dim'),h('div',{style:{color:'var(--muted)',fontSize:13}},'paused 카드'))))
  ));
