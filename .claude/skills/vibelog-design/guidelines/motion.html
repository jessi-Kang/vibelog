<!-- @dsCard group="Motion" viewport="700x150" subtitle="fast 150 · base 280 · slow 450 · ease cubic-bezier(.4,0,.2,1). 바운스 없음" name="Motion" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:16px 20px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}
.m{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:10px;border:1px solid var(--line)}
.sw b{font-size:12px;font-weight:700}.sw span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.g{display:grid;gap:12px}@keyframes hov{to{opacity:.85;transform:scale(.98)}}@keyframes w{0%,20%{opacity:.3}40%,100%{opacity:1}}@keyframes bar{0%{width:0}80%,100%{width:100%}}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
 <div class="sw"><i style="display:grid;place-items:center;background:var(--panel)"><span style="width:44px;height:44px;border-radius:10px;background:var(--accent);animation:hov 1.6s var(--ease) infinite alternate"></span></i><b>hover / press</b><span>150ms · opacity .85 · scale .98</span></div>
 <div class="sw"><i style="display:grid;place-items:center;background:var(--panel);font-weight:900;font-size:15px;word-break:keep-all;padding:0 8px;text-align:center"><span><span style="animation:w 3s steps(1) infinite">저는</span> <span style="animation:w 3s .4s steps(1) infinite;color:var(--accent)">커밋만</span> <span style="animation:w 3s .8s steps(1) infinite">하면</span></span></i><b>caption word</b><span>280ms ease-out · .3 → 1</span></div>
 <div class="sw"><i style="display:grid;place-items:center;background:var(--panel)"><span style="width:80%;height:6px;background:var(--line);border-radius:99px;overflow:hidden;display:block"><span style="display:block;height:100%;background:var(--accent);animation:bar 3s var(--ease) infinite"></span></span></i><b>reveal / progress</b><span>280ms · vl-rise 12px 위로</span></div>
 <div class="sw"><i style="display:grid;place-items:center;background:var(--panel)"><span style="width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:vl-pulse 1.6s var(--ease) infinite"></span></i><b>live dot</b><span>vl-pulse · 씬 전환 450ms fade</span></div></div></body></html>
