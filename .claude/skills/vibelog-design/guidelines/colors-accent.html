<!-- @dsCard group="Colors" viewport="700x150" subtitle="민트 하나, 주황은 삽질/building, 빨강은 실패만" name="Accent & semantic" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:16px 20px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}
.m{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:10px;border:1px solid var(--line)}
.sw b{font-size:12px;font-weight:700}.sw span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><i style="background:var(--accent)"></i><b>accent</b><span>#5EE1C3 · 민트 · 키워드 · live</span></div><div class="sw"><i style="background:var(--accent-ink)"></i><b>accent-ink</b><span>#06261F · 민트 위 글자</span></div><div class="sw"><i style="background:var(--accent-soft)"></i><b>accent-soft</b><span>rgba(94,225,195,.15) · pill 배경</span></div><div class="sw"><i style="background:var(--warn)"></i><b>warn</b><span>#FFB454 · 삽질 · building</span></div><div class="sw"><i style="background:var(--danger)"></i><b>danger</b><span>#FF6B6B · 실패 · 반려</span></div></div></body></html>
