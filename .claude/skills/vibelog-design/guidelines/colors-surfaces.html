<!-- @dsCard group="Colors" viewport="700x150" subtitle="배경 4단 — 페이지 위에 패널, 패널 위에 raised" name="Surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:16px 20px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}
.m{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:10px;border:1px solid var(--line)}
.sw b{font-size:12px;font-weight:700}.sw span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><i style="background:var(--bg-deep)"></i><b>bg-deep</b><span>#05080C · 스테이지 밖</span></div><div class="sw"><i style="background:var(--bg)"></i><b>bg</b><span>#0A0E14 · 페이지 · inset</span></div><div class="sw"><i style="background:var(--panel)"></i><b>panel</b><span>#141B24 · 카드</span></div><div class="sw"><i style="background:var(--panel-2)"></i><b>panel-2</b><span>#1B2430 · raised · 태그</span></div><div class="sw"><i style="background:var(--line)"></i><b>line</b><span>#26313F · 1px 라인 · 트랙</span></div></div></body></html>
