<!-- @dsCard group="Spacing" viewport="700x150" subtitle="웹은 6/10/12, 쇼츠는 20/28/70. 라인 1px(웹) · 2px(쇼츠), 상태 띠 3px" name="Radius & stroke" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:16px 20px;box-sizing:border-box;width:700px;height:150px;overflow:hidden}
.m{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:10px;border:1px solid var(--line)}
.sw b{font-size:12px;font-weight:700}.sw span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)">
 <div class="sw"><i style="border-radius:4px;background:var(--panel);border-color:var(--line-strong)"></i><b>xs 4</b><span>체크박스</span></div><div class="sw"><i style="border-radius:6px;background:var(--panel);border-color:var(--line-strong)"></i><b>sm 6</b><span>Tag · 버튼 sm</span></div><div class="sw"><i style="border-radius:10px;background:var(--panel);border-color:var(--line-strong)"></i><b>md 10</b><span>버튼 · 인풋 · 탭</span></div><div class="sw"><i style="border-radius:12px;background:var(--panel);border-color:var(--line-strong)"></i><b>lg 12</b><span>카드 · 패널 · 다이얼로그</span></div><div class="sw"><i style="border-radius:28px;background:var(--panel);border-color:var(--line-strong)"></i><b>xl 28</b><span>쇼츠 카드</span></div><div class="sw"><i style="border-radius:999px;background:var(--panel);border-color:var(--line-strong)"></i><b>pill</b><span>Badge · 상태 · 진행바</span></div></div></body></html>
