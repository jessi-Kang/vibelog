<!-- @dsCard group="Colors" viewport="700x130" subtitle="idea · building · live · paused — 자동 판정" name="Project status" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:16px 20px;box-sizing:border-box;width:700px;height:130px;overflow:hidden}
.m{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:10px;border:1px solid var(--line)}
.sw b{font-size:12px;font-weight:700}.sw span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
 <div style="background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--status-idea);border-radius:12px;padding:12px 14px"><div class="m" style="color:var(--status-idea);font-weight:700">● IDEA</div><div class="m" style="margin-top:6px">레포만 있음</div></div>
 <div style="background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--status-building);border-radius:12px;padding:12px 14px"><div class="m" style="color:var(--status-building);font-weight:700">● BUILDING</div><div class="m" style="margin-top:6px">30일 내 커밋</div></div>
 <div style="background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--status-live);border-radius:12px;padding:12px 14px"><div class="m" style="color:var(--status-live);font-weight:700">● LIVE</div><div class="m" style="margin-top:6px">homepage 있음</div></div>
 <div style="background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--status-paused-stripe);border-radius:12px;padding:12px 14px;opacity:.8"><div class="m" style="color:var(--status-paused);font-weight:700">● PAUSED</div><div class="m" style="margin-top:6px">30일 넘게 조용</div></div></div></body></html>
