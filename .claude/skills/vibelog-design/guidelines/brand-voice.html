<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:16px 20px;box-sizing:border-box;width:700px;height:190px;overflow:hidden}
.m{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.sw i{display:block;height:56px;border-radius:10px;border:1px solid var(--line)}
.sw b{font-size:12px;font-weight:700}.sw span{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:1fr 1fr">
 <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px"><div class="m" style="color:var(--accent);font-weight:700">DO</div><div style="font-size:14px;line-height:1.6">"밤 11시에 깃헙 액션이 돌아서 그날 커밋으로 데브로그를 씁니다."<br>"커밋 메시지에 '왜'가 없으면 글이 밍밍해집니다."<br><span class="m">AI가 커밋 4개 + PR 1개로 작성 · ko · en</span></div></div>
 <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px"><div class="m" style="color:var(--danger);font-weight:700">DON'T</div><div style="font-size:14px;line-height:1.6;color:var(--muted)">"🚀 오늘도 열일했습니다!!" — 이모지·느낌표<br>"혁신적인 자동화 플랫폼" — 마케팅 어휘<br>"글을 썼다" — 반말. 데브로그·내레이션 모두 존댓말</div></div></div></body></html>
