<title>기본 아이콘 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  :root {
    --bg: #0a0e14; --panel: #141b24; --panel2: #1b2430; --line: #26313f; --line-strong: #3a4656;
    --ink: #f3efe6; --ink-soft: #c9cfd8; --muted: #8c98a8; --accent: #5ee1c3;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  main { max-width: 820px; margin: 0 auto; padding-block: 32px 64px; padding-inline: 16px; display: grid; gap: 32px; }
  h1 { margin: 0 0 6px; font-size: 22px; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 16px; }
  .opt { display: grid; gap: 10px; padding: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .opt h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .opt h2 b { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--panel2); color: var(--accent); font: 700 13px "JetBrains Mono", monospace; }
  .opt p { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .rec { color: var(--accent); font-size: 12px; font-weight: 700; }
  .list { display: grid; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 14px; color: var(--ink-soft); }
  .row.me { color: var(--ink); font-weight: 700; }
  .row svg { flex: none; }
  .big { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; background: var(--panel2); }
  .big span { font-weight: 700; }
  .w { color: var(--muted); font: 11px "JetBrains Mono", monospace; }
</style>

<main>
  <header>
    <h1>판단할 게 없을 때 붙일 기본 아이콘</h1>
    <p>소개 글을 아직 못 쓴 프로젝트(지금은 agency)에 붙습니다. 소개 글이 생기면 그 글이 고른 아이콘으로 바뀝니다. 색은 프로젝트 식별색 그대로입니다. 넷 중 하나를 골라 주세요.</p>
  </header>
  <div class="grid" id="opts"></div>
</main>

<script>
  const ICONS = {
    seedling: ["M12 10a6 6 0 0 0-6-6H3v2a6 6 0 0 0 6 6h3m0 2a6 6 0 0 1 6-6h3v1a6 6 0 0 1-6 6h-3m0 5V10"],
    "circle-dashed": ["M8.56 3.69a9 9 0 0 0-2.92 1.95M3.69 8.56A9 9 0 0 0 3 12m.69 3.44a9 9 0 0 0 1.95 2.92m2.92 1.95A9 9 0 0 0 12 21m3.44-.69a9 9 0 0 0 2.92-1.95m1.95-2.92A9 9 0 0 0 21 12m-.69-3.44a9 9 0 0 0-1.95-2.92m-2.92-1.95A9 9 0 0 0 12 3"],
    code: ["m7 8l-4 4l4 4m10-8l4 4l-4 4M14 4l-4 16"],
    box: ["m12 3l8 4.5v9L12 21l-8-4.5v-9zm0 9l8-4.5M12 12v9m0-9L4 7.5"],
  };
  const OTHERS = [
    ["바이브 로그", "#5EE1C3", ["M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1m3 0v18m4-14h2m-2 4h2"]],
    ["거짓말 탐정", "#6FD3F2", ["M3 11h18M5 11V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4M4 17a3 3 0 1 0 6 0a3 3 0 1 0-6 0m10 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0m-4 0h4"]],
    ["아파트 감별사", "#B9A7FF", ["m8 9l5 5v7H8v-4m0 4H3v-7l5-5m1 1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17h-8m0-14v.01M17 7v.01M17 11v.01M17 15v.01"]],
  ];
  const OPTS = [
    ["A", "seedling", "새싹 — 막 시작한 프로젝트", "아직 무엇인지 모르는 게 아니라 '이제 막 심었다'로 읽힙니다. 다른 아이콘(무엇을 하는지)과 뜻이 겹치지 않습니다.", true],
    ["B", "circle-dashed", "점선 원 — 아직 정해지지 않음", "가장 중립적입니다. 다만 '비어 있음·불러오는 중'처럼 보일 수 있습니다."],
    ["C", "code", "코드 꺾쇠 — 만드는 중", "개발 블로그 맥락엔 맞지만 어떤 프로젝트에나 붙을 수 있어 구별이 안 됩니다."],
    ["D", "box", "상자 — 아직 열지 않은 것", "'무언가 들어 있다'는 느낌. 배송·창고 서비스 아이콘으로 읽힐 수 있습니다."],
  ];
  const svg = (paths, color, size) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths.map((d) => `<path d="${d}"/>`).join("")}</svg>`;
  document.getElementById("opts").innerHTML = OPTS.map(([k, icon, title, why, rec]) => `
    <section class="opt">
      <h2><b>${k}</b>${title}${rec ? '<span class="rec">추천</span>' : ""}</h2>
      <p>${why}</p>
      <span class="w">홈 목록 (16px)</span>
      <div class="list">
        ${OTHERS.map(([n, c, p]) => `<div class="row">${svg(p, c, 16)}<span>${n}</span></div>`).join("")}
        <div class="row me">${svg(ICONS[icon], "#3BACDA", 16)}<span>agency</span></div>
      </div>
      <span class="w">프로젝트 페이지 (28px)</span>
      <div class="big"><span>agency</span>${svg(ICONS[icon], "#3BACDA", 28)}</div>
    </section>`).join("");
</script>
