name: devlog

on:
  schedule:
    - cron: "0 14 * * *" # 23:00 KST
    # 백업 회차 — GitHub cron은 회차를 건너뛰기도 한다 (정각 직전 워크플로
    # 수정, 공유 러너 부하). 23:00이 빠지면 이 회차가 대신 돈다. 이미 돌았으면
    # run.ts의 SCHEDULE_GUARD가 바로 종료해 이중 발행·TTS 중복 비용이 없다.
    # KST 자정(15:00 UTC) 전이어야 날짜 버킷이 안 밀린다.
    - cron: "45 14 * * *" # 23:45 KST
  workflow_dispatch:
    inputs:
      regen:
        description: "영상만 다시 만들 글 — 예: vibelog/2026-09-10 (날짜를 빼면 그 레포의 최신 글). 비우면 일반 실행"
        required: false
        default: ""
      poster:
        description: "썸네일만 다시 뽑을 글 — 예: vibelog/2026-09-09. 기존 영상에서 프레임만 재추출 (대본·음성 재생성 없음, 비용 0)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: devlog
  cancel-in-progress: false

jobs:
  devlog:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Remotion 렌더(ko/en 두 편) 여유 포함
    env:
      # secrets 컨텍스트는 if: 조건에서 직접 못 쓴다 — env로 우회
      HAS_ELEVENLABS: ${{ secrets.ELEVENLABS_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ---- 쇼츠 툴체인 (ELEVENLABS 키가 있을 때만 — 없으면 run.ts가 쇼츠를 건너뜀) ----
      - name: Install shorts toolchain (ffmpeg, CJK fonts, Chromium)
        if: ${{ env.HAS_ELEVENLABS == 'true' }}
        run: |
          # 러너에 기본 등록된 크롬·엣지 저장소는 쓰지 않는데, 갱신 경합
          # (Hash Sum mismatch)으로 실행을 두 번 죽였다(run #14·#15 — .list만
          # 지웠더니 노블 러너는 .sources 형식이라 빗나감). 와일드카드로 빼고,
          # 그래도 남는 서드파티 저장소 오류는 실행을 죽이지 않는다 — ffmpeg·
          # 폰트는 우분투 기본 저장소에서 오므로 진짜 문제면 install에서 잡힌다.
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-edge*
          sudo apt-get update || (sleep 15 && sudo apt-get update) || true
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npx playwright install --with-deps chromium

      - name: Install video (Remotion) deps
        if: ${{ env.HAS_ELEVENLABS == 'true' }}
        working-directory: video
        run: npm ci

      - name: Collect, generate devlogs & shorts
        run: |
          if [ -n "$POSTER" ]; then
            # 썸네일만 재추출 — 기존 mp4에서 프레임을 다시 뽑아 덮어쓴다 (API 비용 0)
            npx tsx scripts/poster.ts "$POSTER"
          elif [ -n "$REGEN" ]; then
            # 재생성 모드 — 이미 발행된 글의 쇼츠만 다시 만든다 (대본→음성→녹화→렌더→업로드)
            npx tsx scripts/shorts.ts "$REGEN"
          else
            npx tsx scripts/run.ts
          fi
        env:
          REGEN: ${{ inputs.regen }}
          POSTER: ${{ inputs.poster }}
          # 정기(cron) 회차에만 켠다 — 최근 100분 내 일반 실행이 있었으면
          # 조용히 종료 (백업 회차의 중복 방지). 수동 Run workflow는 가드 없음.
          SCHEDULE_GUARD: ${{ github.event_name == 'schedule' && '1' || '' }}
          # GH_PAT: fine-grained PAT (Contents/Metadata read, 모든 내 레포).
          # 없으면 GITHUB_TOKEN으로 폴백 — public 레포만 읽힌다.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 배포 주소 자동 감지 — projects.yml과 같은 세트
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # 쇼츠 (2단계) — 비어 있으면 쇼츠 단계는 자동으로 건너뛴다
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # (선택) 쇼츠 +알파 그래픽 — 없으면 그래픽 단계만 건너뛴다
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 최종 mp4 업로드 (없으면 업로드 생략 — Actions 아티팩트로만 남음)
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      # Blob 토큰이 없어도 mp4를 받아볼 수 있게 아티팩트로 업로드
      - name: Upload shorts artifacts
        if: ${{ always() && env.HAS_ELEVENLABS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: content/shorts/**/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit content changes
        env:
          REGEN: ${{ inputs.regen }}
          POSTER: ${{ inputs.poster }}
        run: |
          git config user.name "vibelog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            if [ -n "$POSTER" ]; then
              git commit -m "chore: 쇼츠 썸네일 재추출 ($POSTER)"
            elif [ -n "$REGEN" ]; then
              git commit -m "chore: 쇼츠 다시 만듦 ($REGEN)"
            else
              git commit -m "chore: 데브로그 자동 발행 ($(TZ=Asia/Seoul date +%F))"
            fi
            # 실행 중 브랜치에 새 커밋이 올라왔을 수 있다(세션·연속 실행과의 경합) —
            # 리베이스 후 푸시. -X theirs: 충돌 시 이 실행의 결과가 이긴다.
            # run.json은 "가장 최근 실행" 스냅샷이라 연속 regen이 둘 다 다시 쓰면
            # 반드시 충돌하는데, 최신 실행 것이 맞다 (run #34가 여기서 죽어
            # 영상은 업로드되고 json은 옛것인 불일치가 났었다).
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi
