name: devlog

on:
  schedule:
    # GitHub cron은 제때 안 돈다 — 회차를 통째로 건너뛰거나(9/11 23:00),
    # 3시간 넘게 밀려서 돈다(9/10 예정 14:00 → 실행 17:27). 그래서 회차를
    # 밤새 넉넉히 깔아 두고, 날짜는 실행 시각이 아니라 "그 밤"으로 잡는다
    # (run.ts publishDateKST — KST 06:00 전 실행은 전날 밤 회차로 친다).
    # 먼저 돈 회차가 발행을 끝내면 뒤 회차는 SCHEDULE_GUARD가 바로 종료해
    # 이중 발행·TTS 중복 비용이 없다.
    #
    # 그런데 이것도 못 믿는다: 30분 주기인 projects.yml이 실제로는 4시간
    # 간격으로 돌았고(9/12 실측), 이 워크플로의 23:00 회차는 통째로 안 떴다.
    # 그래서 진짜 시계는 Vercel Cron이 쥔다 — vercel.json의 crons가
    # /api/cron/devlog를 부르고, 그 라우트가 여기를 workflow_dispatch로
    # 띄운다 (guard: true). 아래 예약은 그 시계가 죽었을 때의 예비다.
    - cron: "0 14 * * *" # 23:00 KST — 정시
    - cron: "45 14 * * *" # 23:45 KST
    - cron: "0 16 * * *" # 01:00 KST
    - cron: "0 18 * * *" # 03:00 KST — 마지막 기회 (경계 06:00 KST)
  workflow_dispatch:
    inputs:
      regen:
        description: "영상만 다시 만들 글 — 예: vibelog/2026-09-10 (날짜를 빼면 그 레포의 최신 글). 여러 편은 띄어 쓴다 (예: apart/2026-10-11 vibelog/2026-10-11). 비우면 일반 실행. 저장된 대본·목소리를 그대로 쓰므로 디자인·자막을 고친 다시 만들기는 모델·TTS 비용 0"
        required: false
        default: ""
      new_script:
        description: "regen에서 대본부터 새로 쓰기 — 대본(Opus)과 목소리(ElevenLabs) 비용이 든다. 대본 내용이 나쁠 때만 켠다"
        required: false
        type: boolean
        default: false
      rewrite:
        description: "지난 글을 그날 커밋 전부로 다시 쓰고 쇼츠도 대본부터 다시 만들기 — 예: vibelog/2026-10-11. 창은 바로 앞 글의 마지막 커밋 뒤부터 이 글의 마지막 커밋까지. 글(Opus)·삽화·대본·목소리 비용이 든다"
        required: false
        default: ""
      poster:
        description: "썸네일만 다시 뽑을 글 — 예: vibelog/2026-09-09. 기존 영상에서 프레임만 재추출 (대본·음성 재생성 없음, 비용 0)"
        required: false
        default: ""
      small:
        description: "작은 영상 사본(540×960) 붙이기 — all 또는 vibelog/2026-10-07. 데스크톱 팝업이 작게 띄울 때 글자가 깨지지 않게. 기존 영상에서 줄이기만 한다 (비용 0)"
        required: false
        default: ""
      figures:
        description: "이미 발행된 글에 삽화 붙이기 — all 또는 vibelog/2026-09-15,apart/2026-09-14. 글은 안 건드리고 .figures.json만 새로 만든다 (Opus 호출 글당 1–2번)"
        required: false
        default: ""
      intro:
        description: "프로젝트 소개 글만 쓰기 — all 또는 apart,Anchor (icons면 소개 글은 두고 아이콘만, redo면 이미 쓴 소개 글을 같은 날짜에 다시 쓴다). 레포 코드를 읽고 소개 글·서비스 이름·프로젝트 설명을 쓴다. 이미 글이 있는 프로젝트는 첫 글 하루 전 날짜로 들어간다 (Opus 호출 프로젝트당 1–2번 + 삽화)"
        required: false
        default: ""
      preview:
        description: "글을 지금 지시문으로 다시 써서 원래 글과 나란히 보기 — 예: vibelog/2026-09-22,apart/2026-09-21. 발행 안 함, 결과는 실행 요약에 (글당 Opus 1–2번)"
        required: false
        default: ""
      guard:
        description: "중복 방지 — 이 밤에 이미 발행했으면 조용히 종료. 예약 대신 부르는 쪽(Vercel Cron)이 true로 넣는다. 손으로 돌릴 때는 비운다"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: devlog
  cancel-in-progress: false

jobs:
  devlog:
    runs-on: ubuntu-latest
    # Remotion 렌더(ko/en 두 편) 여유 포함. 쇼츠 여러 편 다시 만들기는 편마다 시간이 드니 길게 둔다
    # 지난 글 다시 쓰기는 편마다 글·삽화·대본·목소리·녹화·렌더를 다 해서 12분쯤 든다 (10/11 vibelog 실측).
    # 일곱 편을 한 번에 돌릴 수 있게 길게 둔다 — 시간이 다 되면 마지막 커밋 단계까지 못 가 전부 날아간다
    timeout-minutes: ${{ inputs.rewrite != '' && 300 || inputs.regen != '' && 150 || 45 }}
    env:
      # secrets 컨텍스트는 if: 조건에서 직접 못 쓴다 — env로 우회
      HAS_ELEVENLABS: ${{ secrets.ELEVENLABS_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ---- 쇼츠 툴체인 (ELEVENLABS 키가 있을 때만 — 없으면 run.ts가 쇼츠를 건너뜀) ----
      - name: Install shorts toolchain (ffmpeg, CJK fonts, Chromium)
        if: ${{ env.HAS_ELEVENLABS == 'true' && !inputs.preview }}
        run: |
          # 러너에 기본 등록된 크롬·엣지 저장소는 쓰지 않는데, 갱신 경합
          # (Hash Sum mismatch)으로 실행을 두 번 죽였다(run #14·#15 — .list만
          # 지웠더니 노블 러너는 .sources 형식이라 빗나감). 와일드카드로 빼고,
          # 그래도 남는 서드파티 저장소 오류는 실행을 죽이지 않는다 — ffmpeg·
          # 폰트는 우분투 기본 저장소에서 오므로 진짜 문제면 install에서 잡힌다.
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft-edge*
          sudo apt-get update || (sleep 15 && sudo apt-get update) || true
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          npx playwright install --with-deps chromium

      - name: Install video (Remotion) deps
        if: ${{ env.HAS_ELEVENLABS == 'true' && !inputs.preview }}
        working-directory: video
        run: npm ci

      - name: Collect, generate devlogs & shorts
        run: |
          if [ -n "$PREVIEW" ]; then
            # 미리보기 — 다시 쓴 글을 실행 요약에만 남긴다. content/는 안 건드린다
            npx tsx scripts/devlog-preview.ts "$PREVIEW"
          elif [ -n "$REWRITE" ]; then
            # 지난 글 다시 쓰기 — 그날 커밋 전부로 글·삽화를 다시 쓰고(run.ts --rewrite), 쇼츠는 대본부터.
            # 글이 실패하면 쇼츠는 건드리지 않는다
            for t in $(echo "$REWRITE" | tr ',' ' '); do
              if npx tsx scripts/run.ts --rewrite "$t"; then
                npx tsx scripts/shorts.ts "$t" --new-script || echo "REGEN_FAILED=$REGEN_FAILED $t" >> "$GITHUB_ENV"
              else
                echo "REGEN_FAILED=$REGEN_FAILED $t" >> "$GITHUB_ENV"
              fi
            done
          elif [ -n "$INTRO" ]; then
            # 소개 글 — 레포 코드를 읽고 쓴다 (scripts/intro.ts). 일반 글·쇼츠는 안 건드린다
            npx tsx scripts/intro.ts "$INTRO"
          elif [ -n "$FIGURES" ]; then
            # 삽화 백필 — 이미 발행된 글에 삽화만 붙인다 (글·쇼츠는 안 건드린다)
            npx tsx scripts/figures-backfill.ts "$FIGURES"
          elif [ -n "$SMALL" ]; then
            # 작은 영상 사본 — 기존 mp4를 곱게 줄여 올린다 (API 비용 0)
            npx tsx scripts/small-backfill.ts "$SMALL"
          elif [ -n "$POSTER" ]; then
            # 썸네일만 재추출 — 기존 mp4에서 프레임을 다시 뽑아 덮어쓴다 (API 비용 0)
            npx tsx scripts/poster.ts "$POSTER"
          elif [ -n "$REGEN" ]; then
            # 재생성 모드 — 이미 발행된 글의 쇼츠만 다시 만든다. 저장된 대본으로 음성→녹화→렌더→업로드, new_script면 대본부터
            # 여러 편이면 한 실행 안에서 차례로 — 따로 띄우면 같은 concurrency 그룹에서 기다리던 실행이
            # 뒤에 띄운 실행에 밀려 취소된다. 한 편이 실패해도 나머지는 만들고 커밋한 뒤, 맨 끝 단계에서 실패로 표시한다
            for t in $(echo "$REGEN" | tr ',' ' '); do
              if [ "$NEW_SCRIPT" = "true" ]; then
                npx tsx scripts/shorts.ts "$t" --new-script || echo "REGEN_FAILED=$REGEN_FAILED $t" >> "$GITHUB_ENV"
              else
                npx tsx scripts/shorts.ts "$t" || echo "REGEN_FAILED=$REGEN_FAILED $t" >> "$GITHUB_ENV"
              fi
            done
          else
            npx tsx scripts/run.ts
          fi
        env:
          REGEN: ${{ inputs.regen }}
          NEW_SCRIPT: ${{ inputs.new_script }}
          POSTER: ${{ inputs.poster }}
          SMALL: ${{ inputs.small }}
          FIGURES: ${{ inputs.figures }}
          INTRO: ${{ inputs.intro }}
          PREVIEW: ${{ inputs.preview }}
          REWRITE: ${{ inputs.rewrite }}
          # 예약 회차와, 예약을 대신하는 호출(Vercel Cron → guard: true)에만
          # 켠다 — 이 밤에 이미 발행했으면 조용히 종료해 이중 발행·TTS 중복
          # 비용을 막는다. Jessi가 손으로 돌리는 Run workflow는 가드 없음.
          SCHEDULE_GUARD: ${{ (github.event_name == 'schedule' || inputs.guard) && '1' || '' }}
          # GH_PAT: fine-grained PAT (Contents/Metadata read, 모든 내 레포).
          # 없으면 GITHUB_TOKEN으로 폴백 — public 레포만 읽힌다.
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 발행 전 안전 검사(scripts/safety.ts) — 없으면 모양 규칙만으로 검사한다
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # 배포 주소 자동 감지 — projects.yml과 같은 세트
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          # 쇼츠 (2단계) — 비어 있으면 쇼츠 단계는 자동으로 건너뛴다
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # (선택) 이미지 생성 — 둘 다 쓰고 한쪽이 실패하면 다른 쪽으로 (scripts/art.ts).
          # 둘 다 없으면 그래픽 단계만 건너뛴다
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 최종 mp4 업로드 (없으면 업로드 생략 — Actions 아티팩트로만 남음)
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      # Blob 토큰이 없어도 mp4를 받아볼 수 있게 아티팩트로 업로드
      - name: Upload shorts artifacts
        if: ${{ always() && env.HAS_ELEVENLABS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: content/shorts/**/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit content changes
        env:
          REGEN: ${{ inputs.regen }}
          POSTER: ${{ inputs.poster }}
          SMALL: ${{ inputs.small }}
          FIGURES: ${{ inputs.figures }}
          INTRO: ${{ inputs.intro }}
          REWRITE: ${{ inputs.rewrite }}
        run: |
          git config user.name "vibelog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            if [ -n "$REWRITE" ]; then
              git commit -m "chore: 지난 글 다시 씀 ($REWRITE)"
            elif [ -n "$INTRO" ]; then
              git commit -m "chore: 프로젝트 소개 글 ($INTRO)"
            elif [ -n "$FIGURES" ]; then
              git commit -m "chore: 글 삽화 붙임 ($FIGURES)"
            elif [ -n "$SMALL" ]; then
              git commit -m "chore: 쇼츠 작은 사본 ($SMALL)"
            elif [ -n "$POSTER" ]; then
              git commit -m "chore: 쇼츠 썸네일 재추출 ($POSTER)"
            elif [ -n "$REGEN" ]; then
              git commit -m "chore: 쇼츠 다시 만듦 ($REGEN)"
            else
              # 날짜는 글과 같은 "그 밤" 기준이어야 한다 (run.ts publishDateKST과
              # 같은 식: KST에서 6시간 뺀 날짜). 벽시계로 찍었더니 23:49에 시작한
              # 실행이 자정을 넘겨 커밋해 글은 09-12인데 메시지만 09-13이었다.
              git commit -m "chore: 데브로그 자동 발행 ($(TZ=Asia/Seoul date -d '-6 hours' +%F))"
            fi
            # 실행 중 브랜치에 새 커밋이 올라왔을 수 있다(세션·연속 실행과의 경합) —
            # 리베이스 후 푸시. -X theirs: 충돌 시 이 실행의 결과가 이긴다.
            # run.json은 "가장 최근 실행" 스냅샷이라 연속 regen이 둘 다 다시 쓰면
            # 반드시 충돌하는데, 최신 실행 것이 맞다 (run #34가 여기서 죽어
            # 영상은 업로드되고 json은 옛것인 불일치가 났었다).
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi

      # 여러 편 다시 만들기에서 실패한 편이 있으면 — 만든 편은 위에서 커밋했고, 여기서 실행을 빨갛게 표시한다
      - name: Regen failures
        if: ${{ env.REGEN_FAILED != '' }}
        run: |
          echo "다시 만들지 못한 편:${REGEN_FAILED}"
          exit 1
