name: art-try

# 이미지 생성 API 확인용 — 손으로만 돌린다. 아무것도 커밋하지 않는다.
#   try:     Gemini·OpenAI에서 한 장씩 (키·모델 이름 확인)
#   samples: 둥근 평면(한 색) 시안 — 테마 5 × 장면 2 = 10장, 투명 배경(OpenAI) (scripts/art-samples.ts)
#   commit:  커밋 장면 고정 그림 후보 — 4종 × 어두운·밝은 테마 = 8장 (scripts/art-samples.ts, ART_SET=commit)
#   intro:   소개 글 머리 그림 시안 — 소개 글마다 가로 그림 한 장 (scripts/intro-art-samples.ts)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "try = 한 장씩 확인 / samples = 테마별 시안 10장 / commit = 커밋 그림 후보 8장 / intro = 소개 글 머리 그림"
        type: choice
        options: [samples, commit, intro, try]
        default: samples
      prompt:
        description: "try일 때 그릴 것 (영어 한 문장)"
        required: false
        default: "a small lighthouse on a calm sea at night"

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 한쪽이 실패해도 다른 쪽은 돌린다
      - name: Gemini
        id: gemini
        if: inputs.mode == 'try'
        continue-on-error: true
        run: npx tsx scripts/art.ts --try "$PROMPT" gemini
        env:
          PROMPT: ${{ inputs.prompt }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: OpenAI
        id: openai
        if: inputs.mode == 'try'
        continue-on-error: true
        run: npx tsx scripts/art.ts --try "$PROMPT" openai
        env:
          PROMPT: ${{ inputs.prompt }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Samples
        id: samples
        if: inputs.mode == 'samples' || inputs.mode == 'commit'
        continue-on-error: true
        run: npx tsx scripts/art-samples.ts
        env:
          ART_SET: ${{ inputs.mode == 'commit' && 'commit' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Intro
        id: intro
        if: inputs.mode == 'intro'
        continue-on-error: true
        run: npx tsx scripts/intro-art-samples.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: art-${{ inputs.mode }}
          path: |
            art-try-*
            art-samples/
          if-no-files-found: warn

      # 위 단계들은 실패해도 넘어가게 해 두었으므로, 실패를 여기서 빨갛게 보인다
      - name: Result
        run: |
          echo "gemini: ${{ steps.gemini.outcome }} · openai: ${{ steps.openai.outcome }} · samples: ${{ steps.samples.outcome }} · intro: ${{ steps.intro.outcome }}"
          for o in "${{ steps.gemini.outcome }}" "${{ steps.openai.outcome }}" "${{ steps.samples.outcome }}" "${{ steps.intro.outcome }}"; do
            test "$o" != failure
          done
