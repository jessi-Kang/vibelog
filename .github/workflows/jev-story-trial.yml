# Jev(TypeSafe AI) 이어지는 글·글 종류 시험 — 글 페이지에 붙일 "이전 이야기" 링크와 종류 필터를 Jev가 고를 수 있는지 본다.
# 발행하지 않고 content/를 건드리지 않는다. Opus·TTS를 부르지 않는다 (Jev 비용만, 1센트 안쪽).
# 결과는 실행 요약에 남는다. 시험이 끝나면 이 파일은 지운다.
name: jev-story-trial

on:
  # 이 세션에는 워크플로를 직접 띄울 권한이 없어서, 시험 파일이 바뀌어 푸시되면 돈다
  push:
    paths:
      - "scripts/jev-story-trial.ts"
      - ".github/workflows/jev-story-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ask Jev about story links and kinds
        run: npx tsx scripts/jev-story-trial.ts
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
