<svg viewBox="0 0 390 212" role="img"><title>예정된 네 회차가 모두 늦게 떴고, 마지막 하나만 새벽 6시 경계를 넘어 다음 날 회차로 계산되었다</title><text x="0" y="16" font-family="var(--font-sans)" font-size="15" fill="var(--color-muted)">예정</text><text x="390" y="16" font-family="var(--font-sans)" font-size="15" fill="var(--color-muted)" text-anchor="end">실제로 뜬 시각</text><line x1="0" y1="96" x2="390" y2="96" stroke="var(--color-line-strong)" stroke-width="1.5" /><line x1="315" y1="30" x2="315" y2="106" stroke="var(--color-warn)" stroke-width="1.5" stroke-dasharray="5 4" /><text x="307" y="44" font-family="var(--font-mono)" font-size="15" font-weight="700" fill="var(--color-warn)" text-anchor="end">6시 경계</text><circle cx="254" cy="62" r="4.5" fill="var(--color-accent)" /><path d="M254 66 C254 82, 322 78, 322 90" fill="none" stroke="var(--color-accent)" stroke-width="2.2" /><circle cx="322" cy="96" r="6" fill="var(--color-accent)" /><text x="334" y="88" font-family="var(--font-mono)" font-size="15" font-weight="700" fill="var(--color-accent)">6:06</text><rect x="0" y="140" width="390" height="60" rx="8" fill="var(--color-panel)" stroke="var(--color-line)" /><text x="14" y="164" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="var(--color-ink-soft)">날짜로 보면</text><text x="14" y="186" font-family="var(--font-sans)" font-size="15" fill="var(--color-muted)">새 날의 첫 편 → 내보낸다</text><text x="206" y="164" font-family="var(--font-sans)" font-size="15" font-weight="700" fill="var(--color-accent)">지난 시간으로 보면</text><text x="206" y="186" font-family="var(--font-sans)" font-size="15" fill="var(--color-accent)">12시간 안 → 멈춘다</text></svg>
